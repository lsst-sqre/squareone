version: 2

updates:
  # npm/pnpm package ecosystem
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 15
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    # Block major version updates globally (manual review required)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

    registries:
      - npm-github

    # Cooldown to mitigate supply chain attacks
    # Security updates bypass cooldown automatically
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      exclude:
        # Core framework packages from trusted publishers
        - 'react'
        - 'react-dom'
        - 'next'
        - '@next/*'
        - 'typescript'
        # Type definitions (low risk, from DefinitelyTyped)
        - '@types/*'

    groups:
      # Security updates - patch and minor versions (FIRST - highest priority)
      security-patch:
        applies-to: security-updates
        update-types:
          - 'patch'
          - 'minor'
        patterns:
          - '*'

      # Catchall for development dependencies
      development:
        dependency-type: 'development'
        patterns:
          - '*'

      # Catchall for runtime dependencies
      runtime:
        dependency-type: 'production'
        patterns:
          - '*'

  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    rebase-strategy: 'auto'

    ignore:
      # changesets/action v2 requires the Changesets CLI v3 and renames its
      # inputs; the repo is on CLI v2. Lift this once the release workflow has
      # been migrated to CLI v3.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'

  # Python dependencies (pip)
  - package-ecosystem: 'pip'
    directory: '/'
    versioning-strategy: 'increase-if-necessary'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    rebase-strategy: 'auto'
    groups:
      pip:
        patterns:
          - '*'

  # Docker base images
  - package-ecosystem: 'docker'
    # The only Dockerfile is apps/squareone/Dockerfile. Under the previous
    # `directory: '/'` Dependabot never opened a single docker PR, even with
    # Node 24 and 26 released and majors unblocked — every Node bump in the
    # Dockerfile's history was made by hand. Point it at the directory that
    # actually holds the Dockerfile; `directories` globs, `directory` does not,
    # so this keeps working if another app gains one.
    directories:
      - '/apps/*'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    rebase-strategy: 'auto'

    # Block major version updates, matching the npm policy above. A Node major
    # bump also requires coordinated changes to engines.node and the CI
    # container images, so it is always a manual change.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

    groups:
      docker:
        patterns:
          - '*'

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    # lsst-sqre org secret (for Dependabot)
    token: ${{ secrets.READONLY_PACKAGES_GITHUB_TOKEN }}
