version: 2

updates:
  # npm/pnpm package ecosystem
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 15
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    # Block major version updates globally (manual review required)
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

    registries:
      - npm-github

    # Cooldown to mitigate supply chain attacks
    # Security updates bypass cooldown automatically
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 5
      exclude:
        # Core framework packages from trusted publishers
        - 'react'
        - 'react-dom'
        - 'next'
        - '@next/*'
        - 'typescript'
        # Type definitions (low risk, from DefinitelyTyped)
        - '@types/*'

    groups:
      # Security updates - patch and minor versions (FIRST - highest priority)
      security-patch:
        applies-to: security-updates
        update-types:
          - 'patch'
          - 'minor'
        patterns:
          - '*'

      # Catchall for development dependencies
      development:
        dependency-type: 'development'
        patterns:
          - '*'

      # Catchall for runtime dependencies
      runtime:
        dependency-type: 'production'
        patterns:
          - '*'

  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    rebase-strategy: 'auto'
    groups:
      actions:
        patterns:
          - '*'

  # Python dependencies (pip)
  - package-ecosystem: 'pip'
    directory: '/'
    versioning-strategy: 'increase-if-necessary'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    rebase-strategy: 'auto'
    groups:
      pip:
        patterns:
          - '*'

  # Docker base images
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '03:00'
      timezone: 'America/New_York'
    rebase-strategy: 'auto'
    groups:
      docker:
        patterns:
          - '*'

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    # lsst-sqre org secret (for Dependabot)
    token: ${{ secrets.READONLY_PACKAGES_GITHUB_TOKEN }}
