name: Release

'on':
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # Commit version bumps, create releases
  pull-requests: write # Create/update release PR
  packages: write # Publish to GitHub Packages

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        # Associated app: https://github.com/organizations/lsst-sqre/settings/apps/squareone-ci
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SQUAREONE_CI_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SQUAREONE_CI_GH_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Authenticate GitHub Packages
        # changesets/action v2 no longer writes ~/.npmrc from NPM_TOKEN, so the
        # workflow provides the registry credentials itself.
        run: |
          cat << EOF > "$HOME/.npmrc"
            //npm.pkg.github.com/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: pnpm install

      - name: Create Release Pull Request
        uses: changesets/action@v2
        with:
          # v2 requires the custom token on this input; the GITHUB_TOKEN env var
          # and the credentials from actions/checkout are no longer honoured.
          github-token: ${{ steps.generate_token.outputs.token }}
          publish-script: pnpm run ci:publish
          version-script: pnpm run ci:version
