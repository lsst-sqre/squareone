# siteName, baseUrl, and environmentName are optional. When omitted they
# default from Repertoire service discovery (environment.title,
# services.ui.squareone.url, and environment.label), falling back to
# "Rubin Science Platform", the request origin, and "unknown". They are set here
# because the dev mock discovery describes data.lsst.cloud, and the dev site
# should link back to localhost.
siteName: 'Squareone Development Site'
baseUrl: 'http://localhost:3000'
environmentName: 'development'
siteDescription: |
  The site description.
docsBaseUrl: 'https://rsp.lsst.io'
repertoireUrl: 'http://localhost:3000/repertoire'
timesSquareUrl: 'http://localhost:3000/times-square/api'
coManageRegistryUrl: 'https://id.lsst.cloud'
# The Apps menu lists Times Square and the admin tools from the dev mock
# discovery (by the /dev persona's scopes); appLinks adds extras on top.
enableAppsMenu: true
appLinks:
  - label: 'Nightly Digest'
    href: '/nightlydigest/'
    internal: false
showPreview: true
previewLink: 'https://rsp.lsst.io/roadmap.html'
# Enabled in the dev config so the header unread badge and notifications UI are
# exercisable against the local dev mocks (see src/app/api/dev/semaphore). The
# production default remains false (schema default; Phalanx configs opt in).
enableUserNotifications: true
userNotificationsPollIntervalSeconds: 300
# Gafaelfawr scopes granting access to each admin page. Spelled out here (the
# same values the schema defaults to) so the dev site documents the mapping and
# so toggling scopes in /dev exercises the admin nav filtering.
adminPageScopes:
  notifications: ['admin:notifications']
  serviceTokens: ['admin:token']
  oidcClients: ['admin:oidc']
  sentry: ['exec:admin']
# New configuration for filesystem-based MDX content
mdxDir: 'src/content/pages'
sentryTracesSampleRate: 0
sentryReplaysSessionSampleRate: 0
sentryReplaysOnErrorSampleRate: 1.0
sentryDebug: false
sentryOrg: 'rubin-observatory'
sentryProject: 'squareone'
